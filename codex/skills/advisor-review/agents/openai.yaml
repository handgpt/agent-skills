interface:
  display_name: "Advisor Review"
  short_description: "Advisory external review for diffs, artifacts, safe simplifications, and structural risks"
  default_prompt: "Use $advisor-review to get a concise external review after code or artifact changes are complete. At important code checkpoints, ask it to run in structural mode so it inspects code structure and module boundaries in addition to the diff."
policy:
  allow_implicit_invocation: true
